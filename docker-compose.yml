services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seqoy
      POSTGRES_PASSWORD: seqoy_dev_password
      POSTGRES_DB: seqoy
    ports:
      - "5432:5432"
    volumes:
      - seqoy_postgres_data:/var/lib/postgresql/data

volumes:
  seqoy_postgres_data:
